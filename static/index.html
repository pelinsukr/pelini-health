<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PelinI | Health & Nutrition</title>

<style>
:root {
    --pink: #C987A1;
    --pink-dark: #AE6F89;
    --pink-light: #F9EEF2;
    --pink-soft: #FDF7F9;
    --white: #FFFFFF;
    --bg: #FAF9FA;
    --text: #39343A;
    --muted: #958B91;
    --border: #F0E8EC;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
}

button, input, textarea, select { font: inherit; }
button { cursor: pointer; }

.layout { min-height: 100vh; }

.sidebar {
    width: 245px;
    position: fixed;
    inset: 0 auto 0 0;
    background: var(--white);
    border-right: 1px solid var(--border);
    padding: 28px 18px;
    display: flex;
    flex-direction: column;
    z-index: 10;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 10px 28px;
    border-bottom: 1px solid var(--border);
}

.brand-mark {
    width: 42px;
    height: 42px;
    background: var(--pink);
    border-radius: 12px;
    display: grid;
    place-items: center;
    color: white;
    font-size: 23px;
    font-weight: 700;
}

.brand-name { font-size: 23px; font-weight: 700; }
.brand-subtitle {
    font-size: 9px;
    letter-spacing: 1.4px;
    color: var(--muted);
    margin-top: 3px;
}

.nav-title {
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 1.4px;
    margin: 27px 10px 12px;
}

.nav-button {
    display: flex;
    align-items: center;
    width: 100%;
    gap: 13px;
    padding: 13px 14px;
    margin-bottom: 5px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: #746A70;
    text-align: left;
    font-size: 14px;
    transition: .2s;
}

.nav-button:hover {
    background: var(--pink-soft);
    color: var(--pink-dark);
}

.nav-button.active {
    background: var(--pink-light);
    color: var(--pink-dark);
    font-weight: 600;
}

.nav-symbol {
    width: 20px;
    text-align: center;
    font-size: 17px;
}

.sidebar-bottom {
    margin-top: auto;
    padding: 16px 10px 0;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    line-height: 1.6;
}

.main {
    margin-left: 245px;
    min-height: 100vh;
    padding: 30px 38px 50px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 35px;
}

.topbar-label {
    font-size: 13px;
    color: var(--muted);
}

.profile-shortcut {
    border: 1px solid var(--border);
    background: white;
    color: var(--text);
    border-radius: 10px;
    padding: 9px 14px;
    font-size: 13px;
}

.page { display: none; }
.page.active { display: block; }

.page-heading { margin-bottom: 25px; }
.page-heading h1 {
    font-size: 26px;
    font-weight: 650;
    margin-bottom: 8px;
}

.page-heading p {
    color: var(--muted);
    font-size: 14px;
}

.card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 23px;
    margin-bottom: 20px;
}

.card h3 {
    font-size: 16px;
    margin-bottom: 17px;
}

.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 20px;
}

.metric {
    background: white;
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 20px;
}

.metric-label {
    font-size: 12px;
    color: var(--muted);
}

.metric-value {
    font-size: 27px;
    font-weight: 650;
    margin: 12px 0 5px;
}

.metric-unit { font-size: 12px; color: var(--muted); }

.metric:nth-child(1) .metric-value { color: var(--pink-dark); }
.metric:nth-child(2) .metric-value { color: #B77D91; }
.metric:nth-child(3) .metric-value { color: #8D7881; }

.content-grid {
    display: grid;
    grid-template-columns: 1.2fr .8fr;
    gap: 18px;
    margin-bottom: 20px;
}
